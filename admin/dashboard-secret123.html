<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; background-color: #fafafa; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1, h2 { color: #111; margin-top: 0; }
    .logout-btn { display: inline-block; padding: 8px 16px; background: #e53e3e; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
    
    /* Styles for the GitHub API Editor */
    .editor-section { margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid #eaeaea; }
    input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { width: 100%; height: 200px; margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
    .btn { padding: 10px 15px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    .btn:hover { background: #0051a2; }
    #status { margin-top: 10px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <div class="container">
    <!-- ORIGINAL DASHBOARD CONTENT -->
    <h1>Admin Control Panel</h1>
    <p>Welcome! You are logged in.</p>
    <hr>
    <p>Manage your site settings or update content here.</p>

    <!-- NEW GITHUB API EDITOR SECTION -->
    <div class="editor-section">
      <h2>Live Content Editor (GitHub API)</h2>
      
      <label for="token">GitHub Personal Access Token:</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

      <button class="btn" onclick="loadFile()">1. Load File Content</button>

      <textarea id="fileContent" placeholder="File content will load here..."></textarea>
      
      <button class="btn" onclick="saveFile()">2. Save Changes to Site</button>

      <p id="status"></p>
    </div>

    <!-- LOGOUT BUTTON -->
    <a href="/admin" class="logout-btn">Log Out</a>
  </div>

  <script>
    // Configuration Settings
    const OWNER = "dadedoyin76-code"; // Replace with your GitHub username
    const REPO = "UCUwebsite-project";   // Replace with your repository name
    const FILE_PATH = "index.html";       // The file you want to edit

    let fileSha = "";

    async function loadFile() {
      const token = document.getElementById("token").value.trim();
      const status = document.getElementById("status");

      if (!token) {
        status.innerText = "Please enter your GitHub token.";
        return;
      }

      status.innerText = "Loading file from GitHub...";

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          headers: { "Authorization": `token ${token}` }
        });

        if (!response.ok) throw new Error("Failed to fetch file.");

        const data = await response.json();
        fileSha = data.sha;
        
        const decodedContent = decodeURIComponent(escape(atob(data.content)));
        document.getElementById("fileContent").value = decodedContent;
        status.innerText = "File loaded successfully!";
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    }

    async function saveFile() {
      const token = document.getElementById("token").value.trim();
      const newContent = document.getElementById("fileContent").value;
      const status = document.getElementById("status");

      if (!token || !fileSha) {
        status.innerText = "Load the file first before saving.";
        return;
      }

      status.innerText = "Saving changes to GitHub...";

      try {
        const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update file via Admin Panel",
            content: encodedContent,
            sha: fileSha
          })
        });

        if (!response.ok) throw new Error("Failed to save file.");

        const data = await response.json();
        fileSha = data.content.sha;
        status.innerText = "Success! Changes committed. Vercel will deploy in ~20 seconds.";
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
  </html>
