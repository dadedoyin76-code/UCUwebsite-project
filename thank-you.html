<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for contacting Unilorin Christian Union.">
    <title>Message Sent | Unilorin Christian Union</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="thank-you-page">
    <header class="header">
        <a href="index.html" class="logo-area" aria-label="Unilorin Christian Union home">
            <img src="logo.png" alt="Unilorin Christian Union Logo" class="logo">
            <div class="brand">
                <h2>Unilorin Christian Union</h2>
                <p>PREACH AND REIGN!</p>
            </div>
        </a>
    </header>

    <main class="thank-you-main">
        <section class="thank-you-card" aria-labelledby="thank-you-title">
            <div class="thank-you-icon" aria-hidden="true">✓</div>
            <div class="section-label">MESSAGE RECEIVED</div>
            <h1 id="thank-you-title">Thank you for reaching out.</h1>
            <p>
                Your message has been submitted successfully. We will review it and get back to you as soon as possible.
            </p>

            <div class="thank-you-actions">
                <a href="index.html" class="primary-button">Back to Homepage <span>→</span></a>
                <a href="index.html#programmes" class="dark-button">View Programmes <span>→</span></a>
            </div>
        </section>
    </main>
